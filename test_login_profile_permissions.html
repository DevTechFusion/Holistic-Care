<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login and Profile APIs with Permissions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 15px; margin: 5px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 3px; width: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Login and Profile APIs with Permissions</h1>
        
        <div class="test-section info">
            <h3>Instructions</h3>
            <p>This page tests the updated login and profile APIs to verify that assigned permissions are included in the responses.</p>
            <p><strong>Base URL:</strong> <span id="baseUrl">http://localhost:8000/api</span></p>
        </div>

        <div class="test-section">
            <h3>1. Login Test</h3>
            <div>
                <input type="email" id="loginEmail" placeholder="Email" value="superadmin@example.com">
                <input type="password" id="loginPassword" placeholder="Password" value="admin123!">
                <button onclick="testLogin()">Test Login</button>
            </div>
            <div id="loginResult"></div>
        </div>

        <div class="test-section">
            <h3>2. Profile Test</h3>
            <div>
                <button onclick="testProfile()" id="profileBtn" disabled>Test Profile (Requires Login)</button>
            </div>
            <div id="profileResult"></div>
        </div>

        <div class="test-section">
            <h3>3. Logout Test</h3>
            <div>
                <button onclick="testLogout()" id="logoutBtn" disabled>Test Logout</button>
            </div>
            <div id="logoutResult"></div>
        </div>
    </div>

    <script>
        let authToken = null;
        const baseUrl = 'http://localhost:8000/api';

        async function testLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const resultDiv = document.getElementById('loginResult');

            try {
                const response = await fetch(`${baseUrl}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.data.token;
                    document.getElementById('profileBtn').disabled = false;
                    document.getElementById('logoutBtn').disabled = false;
                    
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h4>✅ Login Successful</h4>
                            <p><strong>Status:</strong> ${data.status}</p>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <p><strong>Token:</strong> ${data.data.token.substring(0, 20)}...</p>
                            <p><strong>Token Type:</strong> ${data.data.token_type}</p>
                            <p><strong>Expires At:</strong> ${data.data.expires_at}</p>
                            <h5>User Information:</h5>
                            <pre>${JSON.stringify(data.data.user, null, 2)}</pre>
                            <h5>🔑 Assigned Permissions:</h5>
                            <pre>${JSON.stringify(data.data.permissions, null, 2)}</pre>
                            <p><strong>Total Permissions:</strong> ${data.data.permissions.length}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h4>❌ Login Failed</h4>
                            <p><strong>Status:</strong> ${data.status}</p>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Network Error</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function testProfile() {
            if (!authToken) {
                alert('Please login first');
                return;
            }

            const resultDiv = document.getElementById('profileResult');

            try {
                const response = await fetch(`${baseUrl}/profile`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h4>✅ Profile Retrieved Successfully</h4>
                            <p><strong>Status:</strong> ${data.status}</p>
                            <h5>User Information:</h5>
                            <pre>${JSON.stringify(data.data.user, null, 2)}</pre>
                            <h5>🔑 Assigned Permissions:</h5>
                            <pre>${JSON.stringify(data.data.permissions, null, 2)}</pre>
                            <p><strong>Total Permissions:</strong> ${data.data.permissions.length}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h4>❌ Profile Retrieval Failed</h4>
                            <p><strong>Status:</strong> ${data.status}</p>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Network Error</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function testLogout() {
            if (!authToken) {
                alert('Please login first');
                return;
            }

            const resultDiv = document.getElementById('logoutResult');

            try {
                const response = await fetch(`${baseUrl}/logout`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    authToken = null;
                    document.getElementById('profileBtn').disabled = true;
                    document.getElementById('logoutBtn').disabled = true;
                    
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h4>✅ Logout Successful</h4>
                            <p><strong>Status:</strong> ${data.status}</p>
                            <p><strong>Message:</strong> ${data.message}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h4>❌ Logout Failed</h4>
                            <p><strong>Status:</strong> ${data.status}</p>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Network Error</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
